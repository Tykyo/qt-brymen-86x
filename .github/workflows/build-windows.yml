name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Extract installed Qt version
        shell: pwsh
        run: |
          $QT_VERSION = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Leaf
          echo "QT_VERSION=$QT_VERSION" >> $env:GITHUB_ENV
          Write-Output "Detected Qt version: $QT_VERSION"

      - name: Build with qmake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          qmake ..\QtBrymen_86X.pro "CONFIG+=release" "CONFIG-=debug" "QMAKE_CXXFLAGS+=/MP"
          nmake

      - name: Deploy Application
        shell: pwsh
        run: |
          Set-Location build
          nmake deploy
          $BUNDLE_DIR = "bundle\BM86x-windows-x86_64-qt%QT_VERSION%"
          New-Item -ItemType Directory -Force -Path $BUNDLE_DIR
          xcopy /E /I /Y install\* $BUNDLE_DIR\

      - name: Archive Application
        shell: pwsh
        run: |
          Set-Location build/bundle
          Compress-Archive -Path "BM86x-windows-x86_64-qt$env:QT_VERSION" -DestinationPath "BM86x-windows-x86_64-qt$env:QT_VERSION.zip"

      - name: Upload as artefact
        uses: actions/upload-artifact@v7
        with:
          name: BM86x-windows-x86_64-qt${{ env.QT_VERSION }}
          path: build/bundle/BM86x-windows-x86_64-qt${{ env.QT_VERSION }}.zip