name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    env:
      QT_VERSION: '6.11.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install git+https://github.com/miurahr/aqtinstall.git
          python -m aqt version

      - name: Install Qt
        shell: pwsh
        run: |
          $QT_PATH = "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION"

          if (-Not (Test-Path $QT_PATH)) {
            Write-Host "Installing Qt $env:QT_VERSION..."
            python -m aqt install-qt windows desktop "$env:QT_VERSION" win64_msvc2022_64 `
              --outputdir "$env:GITHUB_WORKSPACE\Qt" `
              -m qtserialport qtcharts qtserialbus qtgraphs qtimageformats qtconnectivity qt5compat qtmultimedia qtshadertools qtwebsockets
          } else {
            Write-Host "Using cached Qt $env:QT_VERSION"
          }

      - name: Setup Qt environment
        shell: pwsh
        run: |
          $QT_ROOT = "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\msvc2022_64"
          echo "QT_ROOT=$QT_ROOT" >> $env:GITHUB_ENV
          echo "$QT_ROOT\bin" >> $env:GITHUB_PATH
          $env:PATH = "$QT_ROOT\bin;$env:PATH"
          qmake --version

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with qmake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          qmake ..\QtBrymen_86X.pro "CONFIG+=release" "CONFIG-=debug" "QMAKE_CXXFLAGS+=/MP"
          nmake

      - name: Deploy Application
        shell: pwsh
        run: |
          Set-Location build
          nmake deploy
          $BUNDLE_DIR = "bundle\BM86x-windows-x86_64-qt$env:QT_VERSION"
          New-Item -ItemType Directory -Force -Path $BUNDLE_DIR
          xcopy /E /I /Y install\* $BUNDLE_DIR\

      - name: Archive Application
        shell: pwsh
        run: |
          Set-Location build/bundle
          Compress-Archive -Path "BM86x-windows-x86_64-qt$env:QT_VERSION" -DestinationPath "BM86x-windows-x86_64-qt$env:QT_VERSION.zip"

      - name: Upload as artefact
        uses: actions/upload-artifact@v7
        with:
          name: BM86x-windows-x86_64-qt${{ env.QT_VERSION }}
          path: build/bundle/BM86x-windows-x86_64-qt${{ env.QT_VERSION }}.zip