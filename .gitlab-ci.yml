# .gitlab-ci.yml
stages:
  - build

variables:
  QT_VERSION: "6.11.1"
  PROJECT_NAME: "BM86x"
  GIT_SUBMODULE_STRATEGY: recursive

include:
  - local: '.gitlab/build-linux.yml'
  - local: '.gitlab/build-windows.yml'
  - local: '.gitlab/build-macos.yml'

# Le workflow s'exécute sur les branches master/develop, les MRs et manuellement via l'interface web
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ "/^v/"
    - if: $CI_PIPELINE_SOURCE == "web"
